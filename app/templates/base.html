<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}XJTU-OSCC 口腔鳞癌数据门户{% endblock %}</title><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/typography.css"><link rel="stylesheet" href="/static/patient_detail.css"><link rel="stylesheet" href="/static/patient_detail_layout.css"><link rel="stylesheet" href="/static/readable_scale.css"><link rel="stylesheet" href="/static/form_control_metadata.css"><link rel="stylesheet" href="/static/clinical_form_layout.css"><link rel="stylesheet" href="/static/title_hierarchy.css"></head>
<body>{% if user %}<div class="app-shell"><aside class="sidebar"><div class="brand"><a href="/"><strong>XJTU-OSCC</strong><span>口腔鳞状细胞癌<br>研究数据门户</span></a></div><nav class="sidebar-nav" aria-label="主导航"><a class="{% if request.url.path == '/' %}active{% endif %}" href="/">队列概览</a><p>数据浏览</p><a class="{% if request.url.path.startswith('/patients') %}active{% endif %}" href="/patients">患者队列</a><span class="nav-disabled">全切片图像 <small>待接入</small></span><span class="nav-disabled">标注数据 <small>待接入</small></span><p>研究分析</p><span class="nav-disabled">临床数据 <small>待接入</small></span><span class="nav-disabled">病理特征 <small>待接入</small></span><span class="nav-disabled">肿瘤–神经分析 <small>待接入</small></span><span class="nav-disabled">统计分析 <small>待接入</small></span><p>资源</p><a href="/api/docs">API 文档</a></nav><div class="sidebar-meta"><span>数据集版本</span><strong>V0.1</strong><span>受控研究访问</span></div></aside><div class="workspace"><header class="topbar"><span>经整理的生物医学研究队列</span><div><span class="user-role">{{ user.username }} · {{ user.role }}</span><form action="/logout" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}"><button class="text-button">退出登录</button></form></div></header><main>{% else %}<main class="auth-layout">{% endif %}{% block content %}{% endblock %}</main>{% if user %}</div></div>{% endif %}</body></html>
